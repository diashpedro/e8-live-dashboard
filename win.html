<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólio WIN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0a0b'/%3E%3Crect x='3' y='4' width='2.4' height='8' fill='%23e8a33d'/%3E%3Crect x='6.8' y='6' width='2.4' height='6' fill='%23e8a33d'/%3E%3Crect x='10.6' y='2.5' width='2.4' height='9.5' fill='%23e8a33d'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Painel do portfólio WIN — redesenho de 03/set/2026.
   Marco zero: 04/set, primeiro pregão da arquitetura 100% nativa.

   Linguagem visual: instrumento, não página. Fundo quase preto,
   um único acento âmbar, números em tabular monoespaçado, estado
   comunicado por trilho lateral em vez de bolinha colorida.
   ============================================================ */
:root{
  --bg:#0a0a0b; --panel:#131316; --panel2:#191a1e; --line:#26272d;
  --tx:#eceef2; --dim:#8b8d98; --dim2:#5f6270;
  --ac:#e8a33d;                        /* âmbar: acento único */
  --ok:#4ec97f; --bad:#ff5f56; --warn:#e8a33d; --info:#6ea8fe;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px; --r2:8px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 96px}
a{color:var(--info)}

/* ---------- barra de instrumentos (topo, fixa) ---------- */
#rail{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 78%,transparent);
      padding:14px 0 12px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.seg-row{display:flex;gap:5px;margin-bottom:11px}
.seg{flex:1;height:5px;border-radius:99px;background:var(--line);position:relative;
     transition:background 240ms ease}
.seg.s-ok{background:var(--ok)} .seg.s-bad{background:var(--bad)}
.seg.s-warn{background:var(--warn)} .seg.s-off{background:#2f3138}
.seg.s-bad{animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.seg-legend{display:flex;gap:5px;font-size:10px;letter-spacing:.9px;
            text-transform:uppercase;color:var(--dim2)}
.seg-legend span{flex:1}
.status{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:12px}
.status-word{font-size:15px;font-weight:650;letter-spacing:.3px}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)} .c-off{color:var(--dim)}
.status-meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
.causas{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.causa{font-size:12px;padding:2.5px 9px;border-radius:99px;
       background:#2a1614;color:#ffb3ae;border:1px solid #4d2320}
.st-atencao .causa{background:#2a2110;color:#f0cc8a;border-color:#4d3d17}
.st-operando .causa,.st-fora .causa{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- títulos de seção ---------- */
h2{font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;
   color:var(--dim2);margin:38px 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--dim);font-size:13px;margin:-6px 0 14px}

/* ---------- hoje: número herói ---------- */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:22px 24px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end}
.hero-main{flex:1 1 240px;min-width:0}
.hero-lbl{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2)}
.hero-val{font-family:var(--mono);font-size:clamp(34px,8vw,52px);font-weight:600;
          line-height:1.05;margin-top:6px;letter-spacing:-1.5px}
.hero-sub{font-size:13px;color:var(--dim);margin-top:8px}
.hero-side{display:flex;gap:26px;flex-wrap:wrap}
.stat-k{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2)}
.stat-v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px}
.pos{color:var(--ok)} .neg{color:var(--bad)} .mut{color:var(--dim)}
/* dado velho nunca aparece como dinheiro confiável */
body.stale .money{opacity:.4}
body.stale .money.pos,body.stale .money.neg{color:var(--dim)!important}

/* ---------- linhas genéricas com trilho ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
     border-radius:var(--r2);padding:12px 15px;display:flex;gap:14px;
     align-items:center;flex-wrap:wrap}
.row.r-ok{border-left-color:var(--ok)} .row.r-bad{border-left-color:var(--bad)}
.row.r-warn{border-left-color:var(--warn)} .row.r-info{border-left-color:var(--info)}
.row.r-idle{border-left-color:#2f3138}
.row-main{flex:1 1 190px;min-width:0}
.row-t{font-weight:600;font-size:14px}
.row-d{font-size:12.5px;color:var(--dim);margin-top:2px}
.row-n{font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.row-n small{display:block;font-size:11px;font-weight:400;color:var(--dim);
             font-family:var(--sans);margin-top:2px}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
      padding:2px 7px;border-radius:4px;background:var(--panel2);color:var(--dim);
      border:1px solid var(--line);vertical-align:1px}
.pill.p-ok{color:var(--ok);border-color:#20402e;background:#12241a}
.pill.p-bad{color:var(--bad);border-color:#4d2320;background:#251413}
.pill.p-warn{color:var(--warn);border-color:#4d3d17;background:#241d0f}

/* ---------- módulos ---------- */
.mods{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.mod{background:var(--panel);border:1px solid var(--line);border-left:3px solid #2f3138;
     border-radius:var(--r2);padding:13px 15px}
.mod.m-on{border-left-color:var(--ok)} .mod.m-off{border-left-color:#2f3138}
.mod.m-bad{border-left-color:var(--bad)} .mod.m-armed{border-left-color:var(--ac)}
.mod-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mod-nm{font-weight:600;font-size:14px}
.mod-st{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2)}
.mod.m-on .mod-st{color:var(--ok)} .mod.m-bad .mod-st{color:var(--bad)}
.mod.m-armed .mod-st{color:var(--ac)}
.mod-d{font-size:12.5px;color:var(--dim);margin-top:5px}
.mod-num{font-family:var(--mono);font-size:13px;margin-top:7px;color:var(--dim)}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column}
.fe{display:flex;gap:13px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;
    align-items:flex-start}
.fe:first-child{border-top:0}
.fe-h{font-family:var(--mono);font-size:12px;color:var(--dim2);flex:none;width:52px;padding-top:1px}
.fe-b{flex:1;min-width:0}
.fe-tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;
        margin-right:7px}
.t-entrada{color:var(--info)} .t-saida{color:var(--ok)} .t-erro{color:var(--bad)}
.t-rejeicao{color:var(--dim2)} .t-skip{color:var(--warn)}
.fe-x{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-word}
.fe-rep{font-size:11.5px;color:var(--dim2);margin-top:2px}

/* ---------- vazio ---------- */
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r2);
       padding:22px;text-align:center;color:var(--dim);font-size:13.5px}
.empty b{color:var(--tx);font-weight:600;display:block;margin-bottom:4px;font-size:14.5px}

/* ---------- BI: gráficos, filtro e estatísticas ---------- */
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
          padding:16px 14px 10px}
.chart{width:100%;height:250px;display:block;touch-action:manipulation}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:#3a3c45;stroke-width:1;stroke-dasharray:3 3}
.chart .eq-a{fill:url(#eqg)} .chart .eq-l{fill:none;stroke:var(--ac);stroke-width:2;
             stroke-linejoin:round;stroke-linecap:round}
.chart .eq-p{fill:var(--ac)}
.chart .bar{cursor:pointer}
.chart .bar rect.b{fill:var(--ok)} .chart .bar.dn rect.b{fill:var(--bad)}
.chart .bar rect.hit{fill:transparent}
.chart .bar:hover rect.b,.chart .bar:focus rect.b{fill:var(--ac)}
.chart .bar.sel rect.b{fill:var(--ac)}
.chart .bar.sel rect.hit,.chart .bar:focus rect.hit{fill:rgba(232,163,61,.10)}
.chart .bar:focus{outline:none}
.chart text{fill:var(--dim2);font-size:10px;font-family:var(--mono)}
.chart .lbl-sel{fill:var(--ac)}
.chart-cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
           font-size:11px;color:var(--dim2);margin-top:2px}
.chart-cap b{color:var(--dim);font-weight:500}

.filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:#241d0f;border:1px solid #4d3d17;
      color:var(--ac);border-radius:99px;padding:4px 6px 4px 13px;font-size:12.5px;font-weight:600}
.chip button{background:#3a2f13;border:0;color:var(--ac);border-radius:99px;width:20px;height:20px;
             cursor:pointer;font-size:14px;line-height:1;padding:0}
.chip button:hover{background:var(--ac);color:#1a1206}
.filtro-hint{font-size:12.5px;color:var(--dim2)}

.kpis{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}
.kpi .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2)}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:4px}
.kpi .h{font-size:11px;color:var(--dim2);margin-top:2px}

.brk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:8px}
.brk-c{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px}
.brk-t{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);margin-bottom:9px}
.brk-r{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px}
.brk-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk-b{flex:none;width:64px;height:5px;border-radius:99px;background:var(--panel2);overflow:hidden}
.brk-b i{display:block;height:100%;background:var(--ok)}
.brk-b i.dn{background:var(--bad)}
.brk-v{flex:none;font-family:var(--mono);font-size:12.5px;width:88px;text-align:right}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;
        color:var(--dim2);font-weight:600;padding:0 10px 8px 0;white-space:nowrap}
.tbl td{padding:8px 10px 8px 0;border-top:1px solid var(--line);white-space:nowrap}
.tbl td.n{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);
          border-radius:var(--r2);padding:13px 15px;margin-top:8px}

/* ---------- rodapé ---------- */
details{margin-top:38px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2)}
.foot{font-size:13px;color:var(--dim);margin-top:12px}
.foot p{margin:0 0 9px}
.foot code{font-family:var(--mono);font-size:12px;color:var(--tx);background:var(--panel2);
           padding:1px 5px;border-radius:3px}
@media(max-width:560px){
  .wrap{padding:0 14px 80px}
  .hero{padding:18px}
  .hero-side{gap:18px}
  .seg-legend{font-size:9px;letter-spacing:.4px}
}
</style></head><body>
<div class="wrap">

<div id="rail">
  <div class="seg-row" id="segs" aria-hidden="true"></div>
  <div class="seg-legend"><span>EA</span><span>Terminal</span><span>Cotação</span><span>Dados</span><span>Exposição</span></div>
  <div class="status">
    <span class="status-word" id="statusWord">carregando…</span>
    <span class="status-meta" id="statusMeta"></span>
  </div>
  <div class="causas" id="causas"></div>
  <div class="sr" role="status" id="srStatus"></div>
  <div id="alertSlot"></div>
</div>

<h2>Hoje</h2>
<div id="hoje"></div>

<section id="secExp" hidden>
  <h2>Exposição agora</h2>
  <div class="rows" id="exp"></div>
</section>

<h2>Os sete módulos</h2>
<p class="sub" id="modsSub"></p>
<div class="mods" id="mods"></div>

<h2>O que aconteceu hoje</h2>
<div class="feed" id="feed"></div>

<h2>Desempenho</h2>
<p class="sub" id="biSub"></p>
<div class="chartbox">
  <svg class="chart" id="chart" viewBox="0 0 900 250" preserveAspectRatio="none"
       role="img" aria-label="Curva de capital acumulada e resultado por pregão"></svg>
  <div class="chart-cap">
    <span><b>Acima:</b> capital acumulado desde o marco zero</span>
    <span><b>Abaixo:</b> resultado de cada pregão — clique para filtrar</span>
  </div>
</div>
<div class="filtro" id="filtro"></div>
<div class="kpis" id="kpis"></div>
<div class="brk" id="brk"></div>
<div class="tbl-wrap" id="tradesWrap"></div>

<details>
  <summary>Como ler este painel</summary>
  <div class="foot" id="foot"></div>
</details>
</div>

<script>
/* =========================================================================
   FUNÇÕES PURAS — sem DOM, para poderem ser testadas fora do navegador
   (workspace/check_painel.js roda este mesmo código no node).
   ========================================================================= */

/* Os sete módulos. Desde 03/set/2026 TODOS são nativos: o produtor Python
   (win_sinais.py) foi aposentado e a EA calcula T01/T11/V02 e intramom
   dentro dela. `org` deixou de existir porque deixou de haver diferença. */
const MODULOS=[
 {id:"VB",       nome:"VolBreak",  desc:"rompimento da abertura ± ATR",         janela:"arma 10:00"},
 {id:"VW",       nome:"VWAP",      desc:"reversão na VWAP, gatilho de 1 barra", janela:"M5, até 16:00"},
 {id:"ORB",      nome:"ORB",       desc:"faixa de abertura de 45 min",          janela:"arma ~09:45", nota:"não validado"},
 {id:"t01",      nome:"T01",       desc:"barra de reversão · 6 gavetas",        janela:"M15, até 16:00"},
 {id:"t11",      nome:"T11",       desc:"clímax de sequência · 8 gavetas",      janela:"M15, até 16:00"},
 {id:"v02",      nome:"V02",       desc:"reversão climática · 3 gavetas",       janela:"M15, até 16:00"},
 {id:"intramom", nome:"Intramom",  desc:"momentum do dia vs. 60 pregões",       janela:"janela 17:00"}];

function fmtDur(s){
  if(s===null||s===undefined||isNaN(s)) return null;
  s=Math.max(0,Math.round(s));
  if(s<60) return s+"s";
  const m=Math.floor(s/60);
  if(m<60) return m+"m"+String(s%60).padStart(2,"0")+"s";
  return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")+"m";
}
/* BRT = UTC-3 o ano inteiro (não há horário de verão no Brasil desde 2019).
   Deslocamos o relógio e lemos os campos UTC como se fossem os de Brasília:
   funciona em qualquer fuso do navegador, inclusive no celular em viagem. */
function brtParts(nowMs){
  const b=new Date(nowMs-3*3600*1000);
  return {dow:b.getUTCDay(), minutesOfDay:b.getUTCHours()*60+b.getUTCMinutes(),
          dateStr:b.toISOString().slice(0,10)};
}
function emJanela(nowMs){
  const b=brtParts(nowMs);
  return b.dow>=1 && b.dow<=5 && b.minutesOfDay>=9*60 && b.minutesOfDay<18*60+10;
}
const canon=l=>String(l||"").split(" · ")[0].trim();

/* -------------------------------------------------------------------------
   avaliarEstado — a decisão de raiz do painel.

   DESCONHECIDO NUNCA É VERDE. Todo ramo que não PROVA estado bom termina em
   FALHA ou ATENÇÃO. Em 01/set/2026 o painel mostrou verde durante 8 horas em
   que a EA não estava carregada: campo ausente era lido como campo em ordem.

   Roda no NAVEGADOR a cada segundo, sobre o JSON que pode ter até 3 min de
   atraso. Por isso a idade é sempre recalculada aqui e nunca lida do arquivo.
   ------------------------------------------------------------------------- */
function avaliarEstado(d, nowMs, fetchFails){
  fetchFails=fetchFails||0;
  const falha=[], atencao=[];
  if(fetchFails>=3) falha.push("falha ao buscar data_win.json 3× seguidas");
  if(!d) return {estado:"FALHA", causas:falha.length?falha:["sem dados carregados"],
                 janela:false, idadePubS:null, idadeEaS:null, eaSemEA:true,
                 segs:{ea:"bad",terminal:"bad",cotacao:"bad",dados:"bad",exposicao:"off"}};

  const janela=emJanela(nowMs), brt=brtParts(nowMs);
  const h=d.health||{}, t=d.today||{}, rc=d.reconciliacao||{}, py=d.python||{};
  const op=d.open_positions||[];
  const segs={ea:"off",terminal:"off",cotacao:"off",dados:"off",exposicao:"off"};

  /* --- idade da publicação --- */
  let idadePubS=null;
  const pub=Date.parse(d.updated_at);
  if(!isNaN(pub)) idadePubS=Math.round((nowMs-pub)/1000);
  else atencao.push("updated_at ausente ou inválido");
  if(idadePubS===null) segs.dados="warn";
  else if(janela && idadePubS>15*60){ falha.push("publicação com "+fmtDur(idadePubS)+" de atraso"); segs.dados="bad"; }
  else segs.dados=(janela && idadePubS>6*60)?"warn":"ok";

  /* --- o JSON é de hoje? --- */
  if(brt.minutesOfDay>9*60+15){
    if(!t.date){ falha.push("sem data de hoje no JSON"); segs.dados="bad"; }
    else if(t.date!==brt.dateStr){ falha.push("data do JSON ("+t.date+") não é hoje"); segs.dados="bad"; }
  }

  /* --- terminal e algo trading --- */
  if(h.terminal_connected===false){ falha.push("terminal desconectado"); segs.terminal="bad"; }
  else if(h.terminal_connected===undefined){ atencao.push("terminal_connected ausente"); segs.terminal="warn"; }
  else segs.terminal="ok";
  if(h.algo_trading===false){ falha.push("algo trading desligado"); segs.terminal="bad"; }
  else if(h.algo_trading===undefined){ atencao.push("algo_trading ausente"); if(segs.terminal!=="bad") segs.terminal="warn"; }

  /* --- cotação dos símbolos --- */
  /* Fora do pregao NAO ha cotacao, e isso e o esperado -- nao uma falha.
     Tratar bid=0 as 20h como FALHA deixava o painel vermelho toda noite; um
     alarme que toca todo dia deixa de ser lido, inclusive no dia em que a
     cotacao sumir DURANTE o pregao, que e quando importa de verdade. */
  const syms=h.symbols||[];
  if(!syms.length){
    if(janela){ atencao.push("sem estado de cotação dos símbolos"); segs.cotacao="warn"; }
  } else {
    const semCotacao=syms.filter(s=>s&&s.ok===false).map(s=>s.symbol||"?");
    if(!semCotacao.length) segs.cotacao=janela?"ok":"off";
    else if(janela){
      semCotacao.forEach(sy=>falha.push("símbolo "+sy+" sem cotação válida"));
      segs.cotacao="bad";
    } else segs.cotacao="off";   // mercado fechado: sem cotação é o normal
  }

  /* --- heartbeat da EA: a prova de que ela está viva mesmo sem negociar --- */
  let idadeEaS=null, eaSemEA=false;
  if(typeof h.ea_heartbeat_epoch==="number"){
    idadeEaS=Math.round(nowMs/1000-h.ea_heartbeat_epoch);
    if(janela && idadeEaS>30*60){ falha.push("EA sem heartbeat há "+fmtDur(idadeEaS)); eaSemEA=true; segs.ea="bad"; }
    else if(janela && idadeEaS>10*60){ atencao.push("heartbeat da EA com "+fmtDur(idadeEaS)); segs.ea="warn"; }
    else segs.ea="ok";
  } else { eaSemEA=true; segs.ea="warn";
           atencao.push("sem heartbeat da EA (health.ea_heartbeat_epoch ausente)"); }

  /* --- a ponte Python foi aposentada em 03/set. Se ela reaparecer viva, é
         porque alguém religou o híbrido sem avisar o painel: vale atenção. --- */
  if(py && py.presente===true && typeof py.heartbeat_epoch==="number"
     && Math.round(nowMs/1000-py.heartbeat_epoch)<600)
    atencao.push("ponte Python ativa — a arquitetura em vigor é 100% nativa");

  if((h.errors_today||0)>0) atencao.push(h.errors_today+" erro(s) no log hoje");

  /* --- exposição: pendentes e posições fora de hora são falha, não detalhe --- */
  const pend=h.pendentes||0;
  if(pend>0 && brt.minutesOfDay>17*60+45) falha.push(pend+" ordem(ns) pendente(s) após a zeragem");
  else if(pend>0 && brt.minutesOfDay>16*60) atencao.push(pend+" ordem(ns) pendente(s) após 16:00");
  if(op.length>0 && brt.minutesOfDay>17*60+45) falha.push("posição aberta após a zeragem");
  const temExp=op.length>0||pend>0;
  segs.exposicao = temExp ? (brt.minutesOfDay>17*60+45?"bad":"warn") : (janela?"ok":"off");

  /* --- reconciliação: a corretora é a fonte da verdade --- */
  if(typeof rc.volume_ok==="boolean"){
    if(!rc.volume_ok) atencao.push("volume não bate: corretora "+rc.volume_corretora+" × pernas "+rc.volume_pernas);
  } else if(rc.comparavel===true){ if(rc.ok===false) atencao.push("reconciliação diverge em R$"); }
  else if(temExp) atencao.push("reconciliação de volume indisponível com posição em aberto");

  let estado, causas;
  if(falha.length){ estado="FALHA"; causas=falha; }
  else if(atencao.length){ estado="ATENCAO"; causas=atencao; }
  else if(janela){ estado="OPERANDO"; causas=[]; }
  else { estado="FORA"; causas=[]; }
  if(!janela && !falha.length) Object.keys(segs).forEach(k=>{ if(segs[k]==="ok") segs[k]="off"; });

  return {estado, causas, janela, idadePubS, idadeEaS, eaSemEA, segs};
}

/* Estado de UM módulo. Posicionado > sem EA > armado > aguardando. */
function estadoModulo(mod, aberta, armadas, ctx){
  if(aberta) return {k:"posicionado", cls:"m-on"};
  if(ctx.eaSemEA) return {k:"sem EA", cls:"m-bad"};
  if(armadas>0) return {k:"armado", cls:"m-armed"};
  if(!ctx.janela) return {k:"fora de pregão", cls:"m-off"};
  return {k:"aguardando", cls:"m-off"};
}
/* -------------------------------------------------------------------------
   ESTATÍSTICA — tudo derivado da lista de trades, para que o mesmo cálculo
   valha no acumulado inteiro e num único pregão filtrado. Sem biblioteca:
   são quatro somas e um máximo, e uma dependência a mais no painel seria
   uma dependência a mais para quebrar num dia de pregão.
   ------------------------------------------------------------------------- */
function estatisticas(trades){
  const n=trades.length;
  const vazio={n:0,wins:0,losses:0,taxa:null,pnl:0,ganhoBruto:0,perdaBruta:0,
               fatorLucro:null,expectancia:null,ganhoMedio:null,perdaMedia:null,
               payoff:null,melhor:null,pior:null,seqG:0,seqP:0,minutosMedio:null};
  if(!n) return vazio;
  let pnl=0,gb=0,pb=0,wins=0,mins=0,melhor=null,pior=null;
  let sg=0,sp=0,maxG=0,maxP=0;
  /* streak na ordem CRONOLÓGICA de saída; a lista chega mais nova primeiro */
  const ord=trades.slice().sort((a,b)=>String(a.exit_time).localeCompare(String(b.exit_time)));
  for(const t of ord){
    const v=+t.pnl||0;
    pnl+=v; mins+=(+t.minutos||0);
    if(v>0){ wins++; gb+=v; sg++; sp=0; if(sg>maxG) maxG=sg; }
    else   { pb+=Math.abs(v); sp++; sg=0; if(sp>maxP) maxP=sp; }
    if(melhor===null||v>melhor.pnl) melhor={pnl:v,mod:t.strategy_label||t.strategy,data:String(t.exit_time).slice(0,10)};
    if(pior===null||v<pior.pnl)     pior  ={pnl:v,mod:t.strategy_label||t.strategy,data:String(t.exit_time).slice(0,10)};
  }
  const losses=n-wins;
  return {n,wins,losses,
    taxa:Math.round(100*wins/n),
    pnl:Math.round(pnl*100)/100,
    ganhoBruto:Math.round(gb*100)/100, perdaBruta:Math.round(pb*100)/100,
    /* sem perda alguma, fator de lucro é infinito -- devolvemos null e a tela
       escreve "—", em vez de imprimir Infinity ou fingir um número */
    fatorLucro: pb>0 ? Math.round(100*gb/pb)/100 : null,
    expectancia:Math.round(100*pnl/n)/100,
    ganhoMedio: wins?Math.round(100*gb/wins)/100:null,
    perdaMedia: losses?Math.round(100*pb/losses)/100:null,
    payoff: (wins&&losses&&pb>0) ? Math.round(100*(gb/wins)/(pb/losses))/100 : null,
    melhor,pior,seqG:maxG,seqP:maxP,
    minutosMedio:Math.round(mins/n)};
}

/* Rebaixamento máximo sobre a curva de capital acumulada. Devolve o valor
   (positivo) e a data do fundo -- é a pergunta "quanto o pior momento custou
   em relação ao melhor momento anterior". */
function rebaixamento(serie){
  let pico=0, maxDD=0, quando=null, cum=0;
  for(const d of serie){
    cum += (+d.pnl||0);
    if(cum>pico) pico=cum;
    const dd=pico-cum;
    if(dd>maxDD){ maxDD=dd; quando=d.date; }
  }
  return {valor:Math.round(maxDD*100)/100, data:quando};
}

/* Agrupa trades por uma chave e ordena pelo PnL (maior primeiro). */
function agrupar(trades, chave){
  const m=new Map();
  for(const t of trades){
    const k=String(t[chave]??"—");
    const a=m.get(k)||{nome:k,n:0,wins:0,pnl:0};
    a.n++; a.pnl+=(+t.pnl||0); if((+t.pnl||0)>0) a.wins++;
    m.set(k,a);
  }
  return [...m.values()].map(a=>({...a,pnl:Math.round(a.pnl*100)/100}))
                        .sort((x,y)=>y.pnl-x.pnl);
}

/* Trades de um dia (YYYY-MM-DD) ou todos, se dia for nulo. */
function filtrarPorDia(trades, dia){
  return dia ? trades.filter(t=>String(t.exit_time).slice(0,10)===dia) : trades.slice();
}
/* ===================== fim das funções puras ===================== */

if(typeof module!=="undefined"&&module.exports)
  module.exports={avaliarEstado,estadoModulo,emJanela,brtParts,fmtDur,canon,MODULOS,
                  estatisticas,rebaixamento,agrupar,filtrarPorDia};

   ========================================================================= */
let diaSel = null;                    // YYYY-MM-DD ou null = tudo

function renderBI(d){
  const serie=(d&&d.daily_series)||[];
  const todos=(d&&d.trades)||[];

function desenhaGrafico(serie){
  const svg=$("chart");
  const W=Math.max(320, Math.round(svg.clientWidth||900)), H=250;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const padL=8, padR=8, w=W-padL-padR;
  const EQ_T=12, EQ_H=118;                 // painel de cima: capital acumulado
  const BAR_T=EQ_T+EQ_H+26, BAR_H=64;      // painel de baixo: pregão a pregão
  const BAR_0=BAR_T+BAR_H/2;               // linha do zero das barras

  /* acumulado */
  let cum=0; const pts=serie.map((x,i)=>{ cum+=(+x.pnl||0); return {i,date:x.date,cum}; });
  const cums=pts.map(p=>p.cum).concat([0]);
  const cMin=Math.min(...cums), cMax=Math.max(...cums);
  const span=(cMax-cMin)||1;
  const n=serie.length;
  const colW=w/n;
  const cx=i=>padL+colW*(i+0.5);
  const cy=v=>EQ_T+EQ_H-((v-cMin)/span)*EQ_H;

  /* barras */
  const maxAbs=Math.max(...serie.map(x=>Math.abs(+x.pnl||0)),1);
  const bw=Math.max(2, Math.min(26, colW*0.56));

  const linha=pts.map((p,i)=>`${i?"L":"M"}${cx(i).toFixed(1)},${cy(p.cum).toFixed(1)}`).join("");
  const area=n>1
    ? `${linha}L${cx(n-1).toFixed(1)},${cy(cMin).toFixed(1)}L${cx(0).toFixed(1)},${cy(cMin).toFixed(1)}Z`
    : "";

  const barras=serie.map((x,i)=>{
    const v=+x.pnl||0;
    const h=Math.max(2,(Math.abs(v)/maxAbs)*(BAR_H/2-3));
    const y=v>=0?BAR_0-h:BAR_0;
    const sel=x.date===diaSel;
    const dia=x.date.slice(8,10)+"/"+x.date.slice(5,7);
    return `<g class="bar ${v<0?"dn":""} ${sel?"sel":""}" data-dia="${esc(x.date)}"
              tabindex="0" role="button" aria-pressed="${sel}"
              aria-label="${esc(dia)}: ${esc(brl(v))} em ${x.trades||0} trade(s)">
       <rect class="hit" x="${(padL+colW*i).toFixed(1)}" y="${EQ_T}" width="${colW.toFixed(1)}" height="${BAR_T+BAR_H-EQ_T}" rx="3"/>
       <rect class="b" x="${(cx(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"/>
     </g>`;
  }).join("");

  /* rótulos: no máximo ~9, para não virar borrão */
  const passo=Math.max(1,Math.ceil(n/9));
  const rotulos=serie.map((x,i)=>
    (i%passo===0||x.date===diaSel)
      ? `<text class="${x.date===diaSel?"lbl-sel":""}" x="${cx(i).toFixed(1)}" y="${BAR_T+BAR_H+16}" text-anchor="middle">${x.date.slice(8,10)}/${x.date.slice(5,7)}</text>`
      : "").join("");

  svg.innerHTML=`
   <defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="var(--ac)" stop-opacity=".26"/>
     <stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
   </linearGradient></defs>
   <line class="grid-l" x1="${padL}" y1="${EQ_T+EQ_H}" x2="${W-padR}" y2="${EQ_T+EQ_H}"/>
   ${cMin<0&&cMax>0?`<line class="zero" x1="${padL}" y1="${cy(0).toFixed(1)}" x2="${W-padR}" y2="${cy(0).toFixed(1)}"/>`:""}
   ${area?`<path class="eq-a" d="${area}"/>`:""}
   <path class="eq-l" d="${linha}"/>
   ${n===1?`<circle class="eq-p" cx="${cx(0).toFixed(1)}" cy="${cy(pts[0].cum).toFixed(1)}" r="3.5"/>`:""}
   <text x="${padL}" y="${EQ_T-2}">${esc(brl0(cMax))}</text>
   <line class="zero" x1="${padL}" y1="${BAR_0}" x2="${W-padR}" y2="${BAR_0}"/>
   ${barras}${rotulos}`;

  svg.querySelectorAll(".bar").forEach(g=>{
    const sel=()=>{ diaSel = (diaSel===g.dataset.dia) ? null : g.dataset.dia; pintar(); };
    g.addEventListener("click", sel);
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sel(); } });
  });
}

function renderFiltro(serie){

function kpi(k,v,h,c){ return `<div class="kpi"><div class="k">${k}</div>

function renderKpis(trades, serie){
  const e=estatisticas(trades);

  const nd=n=>n===null||n===undefined?"—":n;
  $("kpis").innerHTML=[
    kpi("Resultado", brl(e.pnl), `${e.n} trade(s)`, "money "+cls(e.pnl)),
    kpi("Taxa de acerto", e.taxa===null?"—":e.taxa+"%", `${e.wins}G / ${e.losses}P`),
    kpi("Fator de lucro", nd(e.fatorLucro),
        e.fatorLucro===null?"sem perdas":`${brl0(e.ganhoBruto)} ÷ ${brl0(e.perdaBruta)}`,
        e.fatorLucro===null?"":(e.fatorLucro>=1?"pos":"neg")),
    kpi("Expectância", e.expectancia===null?"—":brl(e.expectancia), "por trade",
        e.expectancia===null?"":cls(e.expectancia)),
    kpi("Payoff", nd(e.payoff),
        (e.ganhoMedio!==null&&e.perdaMedia!==null)?`${brl0(e.ganhoMedio)} × ${brl0(e.perdaMedia)}`:"ganho ÷ perda média"),
    kpi("Rebaixamento", dd.valor?"−"+brl0(dd.valor):"—",
        dd.data?("fundo em "+dd.data.slice(8,10)+"/"+dd.data.slice(5,7)):"nenhum", dd.valor?"neg":""),
    kpi("Melhor trade", e.melhor?brl(e.melhor.pnl):"—", e.melhor?esc(e.melhor.mod):"", e.melhor?cls(e.melhor.pnl):""),
    kpi("Pior trade", e.pior?brl(e.pior.pnl):"—", e.pior?esc(e.pior.mod):"", e.pior?cls(e.pior.pnl):""),
    kpi("Sequências", e.n?`${e.seqG} / ${e.seqP}`:"—", "ganhos / perdas seguidas"),
    kpi("Duração média", e.minutosMedio===null?"—":e.minutosMedio+" min", "posição aberta"),
  ].join("");
}

function renderQuebras(trades){
  const blocos=[["Por módulo","strategy_label"],["Por saída","motivo_label"],["Por lado","side"]];
  $("brk").innerHTML=blocos.map(([titulo,chave])=>{
    const gs=agrupar(trades,chave);
    if(!gs.length) return `<div class="brk-c"><div class="brk-t">${titulo}</div>
      <div class="brk-r"><span class="brk-n mut">sem trades no recorte</span></div></div>`;
    const max=Math.max(...gs.map(g=>Math.abs(g.pnl)),1);
    return `<div class="brk-c"><div class="brk-t">${titulo}</div>`+gs.map(g=>
      `<div class="brk-r">
         <span class="brk-n">${esc(g.nome)}</span>
         <span class="brk-b"><i class="${g.pnl<0?"dn":""}" style="width:${Math.round(100*Math.abs(g.pnl)/max)}%"></i></span>
         <span class="brk-v ${cls(g.pnl)}">${esc(brl0(g.pnl))}</span>
       </div>`).join("")+`</div>`;
  }).join("");
}

function renderTrades(trades){
  if(!trades.length){
    $("tradesWrap").innerHTML=`<div class="brk-t">Trades</div>
      <div class="brk-r"><span class="brk-n mut">nenhum trade no recorte selecionado</span></div>`;
    return;
  }
  const ord=trades.slice().sort((a,b)=>String(b.exit_time).localeCompare(String(a.exit_time)));
  $("tradesWrap").innerHTML=`<div class="brk-t">Trades (${ord.length})</div>
   <table class="tbl"><thead><tr>
     <th>Saída</th><th>Módulo</th><th>Lado</th><th>Qtd</th>
     <th style="text-align:right">Entrada</th><th style="text-align:right">Saída</th>
     <th style="text-align:right">Min</th><th>Motivo</th><th style="text-align:right">Resultado</th>
   </tr></thead><tbody>`+
   ord.slice(0,300).map(t=>`<tr>
     <td>${esc(String(t.exit_time).slice(8,10)+"/"+String(t.exit_time).slice(5,7))} ${esc(hhmm(t.exit_time))}</td>
     <td>${esc(t.strategy_label||t.strategy)}</td>
     <td>${esc(t.side)}</td><td class="n">${esc(t.qty)}</td>
     <td class="n">${esc(t.entry_price)}</td><td class="n">${esc(t.exit_price)}</td>
     <td class="n">${Math.round(+t.minutos||0)}</td>
     <td>${esc(t.motivo_label||t.motivo||"")}</td>
     <td class="n ${cls(t.pnl)}">${esc(brl(t.pnl))}</td>
   </tr>`).join("")+`</tbody></table>`;
}

function pintar(){
  const est=avaliarEstado(dados, Date.now(), fetchFails);
  renderRail(est);
  renderHoje(dados); renderExp(dados,est); renderMods(dados,est);
  renderFeed(dados); renderBI(dados);
}
async function buscar(){
  try{
    const r=await fetch("data_win.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    dados=await r.json(); fetchFails=0;
  }catch(e){ fetchFails++; }
  pintar();
}
buscar();
let tResize=null;
addEventListener("resize",()=>{ clearTimeout(tResize); tResize=setTimeout(pintar,150); });
setInterval(buscar, 60000);   // arquivo novo
setInterval(pintar,  1000);   // idade e veredito andam sozinhos
</script>
